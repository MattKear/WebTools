<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ArduPilot Kinematic Tool</title>
<link rel="icon" href="../images/AP_favicon.png">
<script type="text/javascript" src="AutorotationTool.js"></script>
<script type="text/javascript" src="../Libraries/FileSaver.js"></script>
<script type="text/javascript" src="../Libraries/Array_Math.js"></script>
<script type="text/javascript" src="../Libraries/Param_Helpers.js"></script>
<script type="text/javascript" src="../Libraries/Plotly_helpers.js"></script>
<script type="text/javascript" src="../Libraries/ParameterMetadata.js"></script>

<script src='../modules/plotly.js/dist/plotly.min.js'></script>

<script src="../modules/build/floating-ui/dist/umd/popper.min.js"></script>
<script src="../modules/build/tippyjs/dist/tippy-bundle.umd.min.js"></script>

</head>
<table style="width:1200px"><tr><td>
  <a href="https://ardupilot.org"><img src="../images/ArduPilot.png"></a>
</td><td>
  <a href="https://github.com/ArduPilot/WebTools"><img src="../images/github-mark.png" style="width:60px"></a>
  <br>
  <a href="https://github.com/ArduPilot/WebTools"><img src="../images/GitHub_Logo.png" style="width:60px"></a>
</td></tr></table>

<style>
  div.plotly-notifier {
    visibility: hidden;
  }

  fieldset.boxClass {
    width: 245px;
    height: 160px;
  }

  div.plotClass {
    width:1117px;
    height:300px;
    display:flex;
    justify-content:center;
    align-items:center;
  }
</style>

<h1><a href="" style="color: #000000; text-decoration:none;">Autorotation Touch Down Trajectory Tool</a></h1>

<body onload="initial_load(); run_sim()">
<table>
  <tr>
    <td>
      <fieldset class="boxClass">
        <legend>Vehicle Properties
            <img id="TT" src="../images/question-circle.svg" style="width: 1em; vertical-align: bottom" 
            data-tippy-content='Properties of vehicle to be used in simulating the initial trajectory before the flare',
            data-tippy-maxWidth='750px'/>
        </legend>

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="rotor_radius" value="0.9" min="0.1" step="0.1" max="10" style="width: 50px" onchange="run_sim()">
          <label for="rotor_radius">Rotor Disk Radius (m)</label>
        </p>

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="rotor_cd" value="0.8" min="0.1" step="0.1" max="2.0" style="width: 50px" onchange="run_sim()">
          <label for="rotor_cd">Rotor Disk CD </label>
        </p>

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="mass" value="8.0" min="2.0" step="0.5" max="100.0" style="width: 50px" onchange="run_sim()">
          <label for="mass">Heli Mass (kg)</label>
        </p>
      </fieldset>
    </td>
  
    <td>
      <fieldset  class="boxClass">
        <legend>Initial Conditions
            <img id="TT" src="../images/question-circle.svg" style="width: 1em; vertical-align: bottom" 
            data-tippy-content='The measurements at the begining of the flare phase',
            data-tippy-maxWidth='750px'/>
        </legend>

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="initial_vel" value="0" min="-20" step="0.5" max="+20" style="width: 50px" onchange="run_sim()">
          <label for="initial_vel">Velocity (m/s) (V0)</label>
        </p>

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="initial_pos" value="8" min="0.5" step="0.5" max="500" style="width: 50px" onchange="run_sim()">
          <label for="initial_pos">Position (m) (P0)</label>
        </p>

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="flare_accel" value="3" min="-10" step="0.1" max="10" style="width: 50px" onchange="run_sim()">
          <label for="flare_accel">Flare Peak Accel (m/s²)</label>
        </p>

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="flare_time_const" value="1" min="0.1" step="0.01" max="3.0" style="width: 50px" onchange="run_sim()">
          <label for="flare_time_const">Flare Time Const (s)</label>
        </p>

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="flare_time_const" value="3" min="-10" step="0.1" max="10" style="width: 50px" onchange="run_sim()">
          <label for="flare_time_const">Flare Pos Start (m)</label>
        </p>

      </fieldset>
    </td>

    <td>
      <fieldset  class="boxClass">
        <legend>Final Conditions
            <img id="TT" src="../images/question-circle.svg" style="width: 1em; vertical-align: bottom" 
            data-tippy-content='The measurements at the end of the flare phase, as the vehicle transitions in to the touchdown phase.',
            data-tippy-maxWidth='750px'/>
        </legend>

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="final_accel" value="0" min="0" step="0.1" max="10" style="width: 50px" onchange="run_sim()">
          <label for="final_accel">Acceleration (m/s²) (AF)</label>
        </p>

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="final_vel" value="-0.5" min="-20" step="0.5" max="0" style="width: 50px" onchange="run_sim()">
          <label for="final_vel">Velocity (m/s) (VF)</label>
        </p>

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="final_pos" value="0.5" min="0.5" step="0.5" max="100" style="width: 50px" onchange="run_sim()">
          <label for="final_pos">Position (m) (PF)</label>
        </p>
      </fieldset>
    </td>

    <td>
      <fieldset  class="boxClass">
        <legend>Parameters
            <img id="TT" src="../images/question-circle.svg" style="width: 1em; vertical-align: bottom" 
            data-tippy-content='The parameter values that the user has to define the curve',
            data-tippy-maxWidth='750px'/>
        </legend>

        <!-- <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="flare_time" value="2" min="1" step="0.1" max="15" style="width: 50px" onchange="run_sim()">
          <label for="flare_time">Flare Time (s) (T)</label>
        </p> -->

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="max_jerk" value="50" min="1.0" step="0.5" max="30" style="width: 50px" onchange="run_sim()">
          <label for="max_jerk">Max Jerk Mag (m/s³)</label>
        </p>

        <p style="margin-top:5px; margin-bottom:5px;">
          <input type="number" id="max_vert_accel" value="20" min="1.0" step="0.1" max="40" style="width: 50px" onchange="run_sim()">
          <label for="max_vert_accel">Max Accel Mag (m/s²)</label>
        </p>

      </fieldset>
    </td>

  </tr>
</table>

<table>
  <tr>
    <td>
      <fieldset style="width:1082px;height:120px">
        <legend>Simulation Options
            <img id="TT" src="../images/question-circle.svg" style="width: 1em; vertical-align: bottom" 
            data-tippy-content='Change simulation options for playing with the controller',
            data-tippy-maxWidth='750px'/>
        </legend>

        <!-- Display options horizontally -->
        <div style="display: flex;
            gap: 2em;          /* space between items */
            align-items: center;
            margin-top: 5px;">

                <p style="margin-top:5px; margin-bottom:5px;">
                  <input type="checkbox" id="method_cb" onchange="run_sim()">
                  <label for="method_cb">Method (3 phase = ticked)</label>
                </p>

                <p style="margin-top:5px; margin-bottom:5px;">
                  <input type="checkbox" id="initial_conditions_cb" onchange="run_sim()" checked>
                  <label for="initial_conditions_cb">Initial Conditions (ticked = flaring)</label>
                </p>
        </div>

      </fieldset>
    </td>

  </tr>
</table>

<div id="jerk_plot" class="plotClass"></div>
<div id="accel_plot" class="plotClass"></div>
<div id="vel_plot" class="plotClass"></div>
<div id="pos_plot" class="plotClass"></div>


<script>

  window.onerror = function(msg, url, linenumber) {
      alert('Sorry, something went wrong.\n\n' + 
            'Please try a hard reload of this page to clear its cache.\n\n' +
            'If the error persists open an issue on the GitHub repo.\n' +
            'Include a copy of the log and the following error message:\n\n' +
            msg + '\n' +
            'URL: '+ url +'\n' +
            'Line Number: '+ linenumber)
      return false
  }
  window.addEventListener('unhandledrejection', function (e) {
    throw new Error(e.reason.stack)
  })

  // Load tool tips
  tippy('#TT')

</script>

</body>
</html>
